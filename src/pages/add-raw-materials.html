<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raw Materials</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="../js/auth_check.js"></script>
  </head>

  <body class="bg-slate-100 dark:bg-slate-900">
    <!-- Top Navbar -->
    <header class="bg-[#001F4D] h-16 flex items-center justify-between px-6 text-white shadow sticky top-0 z-50">
      <div class="flex items-center gap-4">
        <button id="menuToggle" type="button" class="text-white text-xl hover:text-amber-400 transition-colors">
          <i class="fa-solid fa-bars"></i>
        </button>
        <img src="../../assets/images/logo.png" class="w-10 h-10 rounded-full" alt="Logo" />
        <h1 class="text-xl font-bold">MARKING BOOSTER</h1>
      </div>
      <div class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm">
        <i class="fa-regular fa-clock mr-1"></i>
        <span id="currentDate"></span>
      </div>
    </header>

    <div class="flex">
      <!-- Sidebar -->
      <aside id="main-sidebar" class="w-[320px] shrink-0 bg-[#051E3D] fixed lg:sticky top-[64px] left-0 dark:text-gray-300 flex flex-col justify-between h-[calc(100vh-64px)] overflow-y-auto shadow-xl border-r border-slate-800 transition-all duration-300 z-40 transform -translate-x-full lg:translate-x-0">
        <div class="flex flex-col items-center pt-8 pb-6 border-b border-slate-700/40 relative">
          <div class="relative w-24 h-24 rounded-full border-2 border-white/20 p-1 bg-white flex items-center justify-center shadow-sm">
            <span class="text-[#051E3D] font-black text-xl tracking-wider"><img src="../../assets/images/logo.png" class="rounded-full" alt="Logo" /></span>
            <button class="absolute bottom-0 right-1 bg-amber-500 text-slate-900 rounded-full w-6 h-6 flex items-center justify-center text-xs border border-[#051E3D]">
              <i class="fa-solid fa-camera"></i>
            </button>
          </div>
          <h2 class="mt-3 text-lg font-bold text-white tracking-wide">MARKING BOOSTER</h2>
          <span class="mt-1 px-3 py-0.5 bg-amber-500 text-slate-950 font-bold text-[11px] uppercase tracking-wider rounded-md">Branch #1</span>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 py-4 space-y-1" id="sidebarNav">
          <a href="./dashboard.html" class="flex items-center space-x-3 px-3 py-3 rounded-md hover:bg-slate-800/50 text-gray-300 hover:text-amber-400 transition-colors">
            <i class="fa-solid fa-gauge-high text-lg"></i>
            <span class="font-medium text-sm">Dashboard</span>
          </a>
          <a href="./parties.html" class="flex items-center space-x-3 px-3 py-3 rounded-md hover:bg-slate-800/50 text-gray-300 hover:text-amber-400 transition-colors">
            <i class="fa-solid fa-truck text-lg"></i>
            <span class="font-medium text-sm">Suppliers / Customers</span>
          </a>

          <a href="./raw-materials.html" class="flex items-center space-x-3 px-3 py-3 rounded-md bg-slate-800/50 text-amber-400">
            <i class="fa-solid fa-boxes-stacked text-lg"></i>
            <span class="font-medium text-sm">Raw Materials</span>
          </a>

          <div class="relative">
            <button type="button" class="dropdown-toggle w-full flex items-center justify-between px-3 py-3 rounded-md hover:bg-slate-800/50 transition-colors group">
              <div class="flex items-center space-x-3 pointer-events-none select-none text-gray-300 group-hover:text-amber-400">
                <i class="fa-solid fa-file-invoice text-lg"></i>
                <span class="font-medium text-sm">Accounting</span>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-gray-400 pointer-events-none transition-transform duration-200"></i>
            </button>
            <div class="dropdown-menu hidden mt-1 space-y-1 pl-6 transition-all">
              <a href="./expense-management.html" class="block px-4 py-3 border-l-4 border-transparent text-gray-300 hover:text-white hover:bg-slate-700 hover:border-yellow-400 transition-all duration-200">Expense Management</a>
              <a href="./accounting-master.html" class="block px-4 py-3 border-l-4 border-transparent text-gray-300 hover:text-white hover:bg-slate-700 hover:border-yellow-400 transition-all duration-200">Accounting Master</a>
            </div>
          </div>
        </div>

        <div class="p-4 border-t border-slate-700/40 space-y-4">
          <div class="flex items-center justify-between px-2">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-500 flex items-center justify-center">
                <i class="fa-solid fa-palette text-sm"></i>
              </div>
              <span class="text-sm font-medium text-white">Theme</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="theme-toggle" class="sr-only peer" checked />
              <div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
            </label>
          </div>
          <button id="logoutBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-4 rounded-md flex items-center justify-center space-x-2 transition-colors">
            <i class="fa-solid fa-power-off text-sm"></i>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; }
        .dropdown-menu.hidden { display: none; }
      </style>

      <!-- Main Content -->
      <main class="w-full px-4 py-5">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">
          Raw Materials <span class="ml-2 bg-slate-600 text-white text-xs px-3 py-1 rounded-full align-middle">Branch #1</span>
        </h2>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <!-- Add Raw Material form -->
          <div class="bg-white dark:bg-gray-800 border dark:border-gray-700 rounded shadow-sm p-5 h-fit">
            <h3 class="text-blue-600 dark:text-blue-400 font-semibold mb-4">
              <i class="fa-solid fa-circle-plus mr-1"></i> Add Raw Material
            </h3>
            <form id="materialForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">Material Name</label>
                <input type="text" id="materialName" required placeholder="e.g. Milk Pouch 1L" class="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded px-3 py-2 outline-none" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">Unit</label>
                <select id="materialUnit" required class="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded px-3 py-2">
                  <option value="">-- Select Unit --</option>
                  <option value="piece">Piece</option>
                  <option value="kg">Kg</option>
                  <option value="roll">Roll</option>
                  <option value="box">Box</option>
                  <option value="ltr">Litre</option>
                  <option value="meter">Meter</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">Reorder Level (low stock alert)</label>
                <input type="number" step="0.01" min="0" id="materialReorderLevel" placeholder="0" class="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded px-3 py-2 outline-none" />
              </div>
              <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded">
                SAVE RAW MATERIAL
              </button>
              <p id="formMsg" class="text-sm text-center hidden"></p>
            </form>
          </div>

          <!-- List -->
          <div class="lg:col-span-2 bg-white dark:bg-gray-800 border dark:border-gray-700 rounded shadow-sm p-5">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-semibold text-gray-700 dark:text-gray-200">All Raw Materials</h3>
              <input type="text" id="searchInput" placeholder="Search..." class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded px-3 py-2 text-sm" />
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="border-b-2 dark:border-gray-600 text-gray-700 dark:text-gray-200">
                  <tr>
                    <th class="text-left py-2">Name</th>
                    <th class="text-left py-2">Unit</th>
                    <th class="text-right py-2">Current Stock</th>
                    <th class="text-right py-2">Reorder Level</th>
                    <th class="text-right py-2">Last Purchase Rate</th>
                  </tr>
                </thead>
                <tbody id="materialTableBody" class="dark:text-gray-300"></tbody>
              </table>
            </div>
          </div>
        </div>

        <p class="text-center text-xs text-gray-400 mt-8">© 2026 | Powered by: chughtaisoftwares.com</p>
      </main>
    </div>

    <!-- ======================== JAVASCRIPT ======================== -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/add-raw-materials .js"></script>
  </body>
</html>
