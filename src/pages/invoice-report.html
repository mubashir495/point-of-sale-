<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice - MARKING BOOSTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .invoice-container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }
        .invoice-header { border-bottom: 2px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
        .invoice-footer { border-top: 2px solid #1e293b; padding-top: 20px; margin-top: 30px; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-complete { background: #e0e7ff; color: #3730a3; }
        @media print {
            body { background: white; }
            .invoice-container { box-shadow: none; margin: 0; padding: 20px; border-radius: 0; }
            .no-print { display: none !important; }
        }
    </style>
    <script src="../js/auth_check.js"></script>
</head>
<body>
    <div class="invoice-container" id="invoiceContent">
        <div id="loading">Loading invoice...</div>
        <div id="invoiceData" style="display: none;"></div>
    </div>

    <div class="text-center no-print mt-4 mb-8">
        <button onclick="window.print()" class="bg-slate-800 text-white px-6 py-2 rounded-lg hover:bg-slate-700 transition mr-3">
            <i class="fa-solid fa-print mr-2"></i> Print / PDF
        </button>
        <button onclick="shareInvoice()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
            <i class="fa-solid fa-share-alt mr-2"></i> Share
        </button>
        <button onclick="window.close()" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-400 transition ml-3">
            Close
        </button>
    </div>

    <script>
        const API_BASE = "../../action";
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id');
        const autoPrint = params.get('print') === '1';

        async function loadInvoice() {
            if (!orderId) {
                document.getElementById("loading").innerHTML = "No order ID provided.";
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/order/get_order.php?id=${orderId}`);
                const data = await res.json();
                if (!data.success) throw new Error("Order not found");

                const o = data.order;
                const c = data.customer || {};
                const items = data.items || [];
                const total = parseFloat(o.grand_total || o.total || 0);
                const paid = parseFloat(o.paid || 0);
                const discount = parseFloat(o.discount || 0);
                const subtotal = parseFloat(o.subtotal || 0);
                const remaining = total - paid;

                let html = `
                    <div class="invoice-header flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-3">
                                <img src="../../assets/images/logo.png" alt="Logo" class="w-16 h-16 rounded-full" />
                                <div>
                                    <h1 class="text-2xl font-bold text-slate-900">MARKING BOOSTER</h1>
                                    <p class="text-sm text-gray-600">Multan, Pakistan</p>
                                    <p class="text-sm text-gray-600">Phone: 0311-4683143</p>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <h2 class="text-xl font-bold text-slate-800">INVOICE</h2>
                            <p class="text-sm"><strong>Invoice #:</strong> ${o.invoice_no || "N/A"}</p>
                            <p class="text-sm"><strong>Order #:</strong> ${o.order_no || o.id}</p>
                            <p class="text-sm"><strong>Date:</strong> ${new Date().toLocaleDateString()}</p>
                            <p class="text-sm"><strong>Status:</strong> <span class="status-badge status-complete">Complete</span></p>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <h3 class="font-bold text-gray-700 mb-2">Bill To</h3>
                            <p><strong>${c.name || "N/A"}</strong></p>
                            <p>${c.phone || ""}</p>
                            <p>${c.address || ""}</p>
                        </div>
                        <div class="text-right">
                            <p><strong>Order Date:</strong> ${o.order_date || "-"}</p>
                            <p><strong>Delivery Date:</strong> ${o.delivery_date || "-"}</p>
                            <p><strong>Sales Person:</strong> ${o.employee_name || "-"}</p>
                            <p><strong>Payment Method:</strong> ${o.payment_method || "Not Specified"}</p>
                        </div>
                    </div>

                    <table class="w-full border-collapse border border-gray-300 text-sm mb-6">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-gray-300 px-3 py-2 text-left">Product</th>
                                <th class="border border-gray-300 px-3 py-2 text-right">Qty</th>
                                <th class="border border-gray-300 px-3 py-2 text-right">Price</th>
                                <th class="border border-gray-300 px-3 py-2 text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                items.forEach(item => {
                    html += `
                        <tr>
                            <td class="border border-gray-300 px-3 py-2">${item.product_name}</td>
                            <td class="border border-gray-300 px-3 py-2 text-right">${item.quantity}</td>
                            <td class="border border-gray-300 px-3 py-2 text-right">${parseFloat(item.unit_price).toFixed(2)}</td>
                            <td class="border border-gray-300 px-3 py-2 text-right">${parseFloat(item.total).toFixed(2)}</td>
                        </tr>
                    `;
                });
                html += `
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="border border-gray-300 px-3 py-2 text-right font-bold">Subtotal</td>
                                <td class="border border-gray-300 px-3 py-2 text-right">${subtotal.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td colspan="3" class="border border-gray-300 px-3 py-2 text-right font-bold">Discount</td>
                                <td class="border border-gray-300 px-3 py-2 text-right">${discount.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td colspan="3" class="border border-gray-300 px-3 py-2 text-right font-bold text-lg">Grand Total</td>
                                <td class="border border-gray-300 px-3 py-2 text-right font-bold text-lg">${total.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td colspan="3" class="border border-gray-300 px-3 py-2 text-right font-bold">Paid</td>
                                <td class="border border-gray-300 px-3 py-2 text-right">${paid.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td colspan="3" class="border border-gray-300 px-3 py-2 text-right font-bold text-red-600">Remaining</td>
                                <td class="border border-gray-300 px-3 py-2 text-right font-bold text-red-600">${remaining.toFixed(2)}</td>
                            </tr>
                        </tfoot>
                    </table>

                    ${o.remarks ? `<div class="mb-4"><strong>Remarks:</strong> ${o.remarks}</div>` : ""}

                    <div class="invoice-footer flex justify-between items-center">
                        <div>
                            <p class="text-sm text-gray-600">Authorized Signature</p>
                            <div class="mt-8 border-t-2 border-gray-400 w-40"></div>
                        </div>
                        <div class="text-right text-sm text-gray-500">
                            <p>Thank you for your business!</p>
                            <p>Generated on ${new Date().toLocaleString()}</p>
                        </div>
                    </div>
                `;

                document.getElementById("loading").style.display = "none";
                document.getElementById("invoiceData").style.display = "block";
                document.getElementById("invoiceData").innerHTML = html;

                if (autoPrint) {
                    setTimeout(() => window.print(), 500);
                }

            } catch (e) {
                document.getElementById("loading").innerHTML = "Error: " + e.message;
            }
        }

        function shareInvoice() {
            if (navigator.share) {
                navigator.share({
                    title: 'Invoice',
                    text: 'Invoice for order #' + orderId,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                alert("Share feature not supported. You can print or download PDF.");
            }
        }

        loadInvoice();
    </script>
</body>
</html>
